topics:
  - Repaso de conductores en equilibrio (carga en superficie, E = 0)
  - Conductor aislado con cavidad (carga en la superficie externa)
  - Densidad superficial interna nula y rol de la estabilidad del equilibrio
  - Campo eléctrico justo afuera de un conductor (E = σ/ε₀)
  - Argumento erróneo de Resnick sobre la componente normal
  - Continuidad de la componente tangencial del campo
  - Paradoja plano conductor (σ/ε₀) vs plano cargado (σ/2ε₀)
  - Reparto de carga en las dos caras (σ' = σ/2)
  - Prueba experimental de la Ley de Gauss (experimento de la caja)
  - Medida indirecta del exponente de Coulomb (|δ| < 10⁻¹⁵)
  - Experimento propuesto por Priestley (1767)
  - Fuerzas conservativas (trabajo independiente del camino)
  - La fuerza electrostática es conservativa
  - Energía potencial eléctrica (U = Q₀Q/4πε₀r)
  - Constante aditiva y convención U = 0 en el infinito
  - Energía potencial de un conjunto de cargas puntuales
  - Definición de potencial eléctrico (V = U_Q1/Q1)
  - Diferencia de potencial y campo eléctrico (V_B - V_A = -∫E·dl)

