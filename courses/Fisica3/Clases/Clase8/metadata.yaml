topics:
  - Unidades del potencial (Volt = Joule/Coulomb)
  - Electronvolt (1 eV = 1,6×10⁻¹⁹ J) y escalas atómicas
  - Múltiplos MeV y GeV en física de altas energías
  - Potencial de un conjunto de cargas puntuales (V = 1/4πε₀ Σ Qᵢ/R₀ᵢ)
  - Deducción del potencial a partir de la energía potencial
  - Nivel de referencia (V = 0 en el infinito)
  - Ejemplo: cuadrado de cargas (potencial en el centro)
  - Potencial de un dipolo en un punto arbitrario
  - Límite de dipolo puntual (V = p·r̂/4πε₀r², decae como 1/r²)
  - Potencial de una distribución continua de carga (integral)
  - Ejemplo: barra cargada (sustitución hiperbólica, arcsinh)
  - Inversión del seno hiperbólico (arcsinh X = ln(X + √(X²+1)))
  - Límite de gran distancia de la barra (carga puntual)
  - Ejemplo: anillo cargado sobre su eje
  - Ejemplo: disco cargado (suma de anillos)
  - Continuidad del potencial y no derivabilidad en el disco

