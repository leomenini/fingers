topics:
  - Velocidad de desplazamiento o de deriva (v_d)
  - Dirección y sentido de la densidad de corriente J
  - Deriva vs velocidad real de los electrones
  - Régimen estacionario vs equilibrio (analogía viscosa)
  - Relación J = n q v_d (deducción con el cilindrito)
  - Suma sobre varios tipos de portadores
  - Estimación de v_d en el cobre (~cm/hora)
  - Número de portadores por volumen (densidad, masa molar, Avogadro)
  - Analogía de la manguera y velocidad de la señal eléctrica
  - Corrección cuántica (principio de exclusión de Pauli)
  - Ley de Ohm microscópica (J = σE)
  - Conductividad y resistividad (ρ = 1/σ)
  - Materiales óhmicos o lineales
  - Tabla de resistividades (conductores, semiconductores, aislantes)
  - Semiconductores y dopaje
  - Resistencia de un conductor filiforme (R = ρL/A)
  - Ley de Ohm macroscópica (ΔV = RI) y dependencia de los bornes
  - Materiales óhmicos vs no óhmicos (diodo)
  - Modelo microscópico de Drude e hipótesis

