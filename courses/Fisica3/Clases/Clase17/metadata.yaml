  - Decaimiento como dipolo magnético (1/r³)
  - Momento dipolar magnético (μ = IA) y cuadrupolo
  - El solenoide y espiras compactas
  - Suma de espiras e integral del campo
  - Solenoide ideal (L ≫ R, lejos de los bordes)
  - Campo dentro (μ₀nI) y fuera (cero)
  - Ley de Ampère (circulación de B)
  - Analogía con la ley de Gauss y convención de signos
  - Ejemplo: hilo infinito de corriente
  - Ejemplo: cable cilíndrico (dentro y fuera)
  - Ejemplo: solenoide ideal por Ampère
  - Uniformidad del campo en todo el interior del solenoide

