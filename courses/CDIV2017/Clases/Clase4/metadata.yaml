topics:
  - Intuición geométrica de los números reales como puntos de una recta
  - Construcción (Dedekind, Cauchy) vs. axiomatización de R
  - Unicidad de R a menos de isomorfismo
  - Los 15 axiomas de cuerpo ordenado (suma, producto, orden)
  - Unicidad del neutro y del opuesto de la suma; definición de la resta
  - Unicidad del neutro y del inverso del producto
  - Demostración de que 0 es absorbente para el producto
  - Producto nulo y producto igual a 1
  - Los enteros como abreviaturas (2 := 1+1, etc.)
  - Definición del cociente y advertencia sobre dividir entre cero
  - Reducción al mismo denominador (racionales e irracionales)
  - Interpretación geométrica de la suma (paralelogramos)
  - Interpretación geométrica del producto (teorema de Tales)
  - Adelanto de la construcción de la raíz cuadrada con regla y compás
  - Axiomas de orden: totalidad, transitividad, antisimetría
  - Orden estricto y tricotomía
  - Aparte de lógica: la implicación material (falso implica cualquier cosa)
  - Compatibilidad del orden con la suma (sin restricciones)
  - Compatibilidad del orden con el producto (según el signo del multiplicador)

