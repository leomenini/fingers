topics:
  - Repaso de la definición de límite con entornos reducidos
  - Notación lógica: los cuantificadores son símbolos, no abreviaturas
  - El juego entre el implementor y el usuario de la definición
  - Lectura gráfica: banda de precisión y radio de seguridad
  - Continuidad en un punto y los dos tipos de discontinuidad
  - Continuidad en un intervalo (cuatro cuantificadores anidados)
  - Catálogo intuitivo de comportamientos en un punto
  - Oscilación sin límite: sen(1/x) en el origen
  - Ejemplo: la función identidad es continua (delta = epsilon)
  - Ejercicio: la identidad modificada y el radio mín(epsilon, |x0|)
  - Cambiar la función en finitos puntos no altera los límites
  - Qué significa "un radio suficientemente pequeño"
  - Ejemplo: la raíz cuadrada es continua, caso x0 = 0
  - Ejemplo: la raíz cuadrada es continua, caso x0 > 0 (radio asimétrico)
  - Reducción de la precisión a epsilon' = mín(epsilon, raíz de x0)
  - Negación de la definición de límite
  - Contraejemplo: la función signo no tiene límite en 0

