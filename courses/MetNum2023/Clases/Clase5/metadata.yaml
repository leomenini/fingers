topics:
  - Planteo del sistema Ax=b y condición de solución única (det(A) != 0)
  - Métodos directos vs. métodos iterativos
  - Regla de Cramer y su costo O((n+1)!)
  - Conteo de costo en flops y regla de suma de Riemann para sum i^alfa
  - Matrices triangulares y sustitución hacia adelante/hacia atrás (O(n^2))
  - Eliminación gaussiana sin pivoteo: multiplicadores, pseudocódigo, costo O(n^3)
  - Necesidad del pivoteo numérico (no solo evitar el cero exacto)

