topics:
  - Cierre de métodos iterativos: criterio del residuo y criterio de diferencia entre iterados, con red de contención
  - Planteo del problema de interpolación: existencia de infinitas soluciones sin restringir la clase de funciones
  - Motivación de la interpolación polinomial (integración/derivación de datos discretos, CAD)
  - Teorema de existencia y unicidad del polinomio interpolante, demostrado por inducción completa
  - Construcción por la matriz de Vandermonde
  - Mal condicionamiento creciente de Vandermonde con el número de puntos
  - Falta de incrementalidad de Vandermonde al agregar o corregir puntos

bibliography: []

prerequisites:
  - Número de Condición (Clase 8): la desigualdad error-residuo reaparece en el criterio de parada
  - Métodos iterativos matriciales (Jacobi, Gauss-Seidel), vistos en clases previas no incluidas en este lote (Clases 9-10)

next_topics:
  - Error de Interpolación (Clase 12)
  - Construcciones alternativas del polinomio interpolante (bases de Lagrange y Newton, mencionadas pero no desarrolladas acá)

