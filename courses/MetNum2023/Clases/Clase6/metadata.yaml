topics:
  - Por qué falla la eliminación gaussiana sin pivoteo (multiplicadores grandes amplifican error de redondeo)
  - Pivoteo parcial: estrategia, cota |L_jk| <= 1, costo adicional O(n^2)
  - Codificar la eliminación como producto de matrices (permutación y multiplicadores)
  - Teorema de descomposición PA = LU (demostración constructiva, no unicidad)
  - Resolver sistemas usando la LU ya calculada (costo O(n^2))
  - Cuándo conviene calcular la LU (reutilización con múltiples lados derechos)
  - Nota al margen sobre la factorización de Cholesky
  - El operador backslash de MATLAB/Octave (lógica de despacho)
  - Matrices dispersas (introducción)

