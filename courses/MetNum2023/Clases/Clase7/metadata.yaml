topics:
  - Cierre de matrices dispersas y tridiagonales (eliminación gaussiana en tiempo lineal si se avisa la estructura)
  - Repaso de axiomas de norma vectorial y la familia de normas L^p en R^n
  - Normas de matrices: norma de Frobenius vs. normas operador (inducidas)
  - Demostración completa de que la norma infinito inducida es el máximo de las normas L1 de las filas
  - Normas inducidas por L1 (columnas) y L2 (primer valor singular), enunciadas sin demostrar
  - Compatibilidad (||Ax|| <= ||A||||x||) y submultiplicatividad (||AB|| <= ||A||||B||), con demostración
  - Motivación de cierre: diferencia entre error (no computable) y residuo (sí computable), r = A*e

