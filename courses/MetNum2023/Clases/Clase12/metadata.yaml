topics:
  - Forma de Lagrange del polinomio interpolante: base adaptada a los nodos, pros y contras frente a Vandermonde
  - Forma de Newton: coeficientes vía diferencias divididas, incremental por construcción
  - Norma del supremo para funciones y convergencia uniforme
  - Teorema de error de interpolación: f(x) - p_n(x) = f^(n+1)(gamma_x)/(n+1)! * omega_n(x), demostrado con función auxiliar + Rolle repetido
  - Corolario: cota práctica vía max de la derivada (n+1) y norma del polinomio nodal
  - Competencia entre el factorial (n+1)! y el crecimiento de la derivada (n+1) al agregar puntos
  - Ejemplo sin(x)cos(x) en [0,1]: el error decrece superexponencialmente con n

