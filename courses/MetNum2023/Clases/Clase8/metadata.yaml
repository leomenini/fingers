topics:
  - Motivación: sistema con residuo chico pero error enorme (rectas casi paralelas)
  - Del par de desigualdades residuo-error al número de condición kappa(A) = ||A|| ||A^-1||
  - Por qué el determinante no mide el condicionamiento (contraejemplo alpha*I)
  - Caracterización geométrica: cociente entre estiramiento máximo y contracción mínima
  - Análisis de perturbaciones: en el lado derecho b y en la matriz A
  - Teorema de Wilkinson: la solución computada resuelve exactamente un sistema perturbado
  - Mensaje final: el residuo relativo siempre es chico; el error relativo depende de kappa(A)

