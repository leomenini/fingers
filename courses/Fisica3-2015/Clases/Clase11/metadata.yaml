  - Constante dieléctrica (E = E0/K_E, K_E ≥ 1)
  - Materiales lineales y desarrollo de Taylor
  - Ruptura dieléctrica y ferroeléctricos
  - Valores de K_E (vacío, aire, poliestireno, papel, agua)
  - Condensador con dieléctrico (carga de polarización Q')
  - Capacitancia con dieléctrico (C = εA/d)
  - Permitividad eléctrica (ε = K_E ε₀)
  - Ley de Gauss en presencia de dieléctricos (Φ = Q_libre/ε)
  - Ejemplos con varios dieléctricos (paralelo y serie)
  - Corriente eléctrica y conductor fuera del equilibrio
  - Mecanismo de bombeo y mantenimiento de corriente
  - Resistencia y efecto Joule (modelo pinball)
  - Superconductores (resistencia cero, aplicaciones)
  - Definición de corriente (I = dQ/dt) y el Ampere
  - Densidad de corriente (I = ∫ J·n dS)

