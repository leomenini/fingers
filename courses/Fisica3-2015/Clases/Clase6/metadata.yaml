topics:
  - Flujo del campo eléctrico (superficie orientada, flujo saliente)
  - Flujo de campo uniforme a través de un cilindro (flujo neto cero)
  - Flujo de carga puntual a través de esfera centrada (Q/ε₀)
  - Superficie cerrada exterior a la carga (flujo cero)
  - Ángulo sólido (Ω = S/r², esfera entera = 4π)
  - Superficie arbitraria sin la carga (descomposición en esferas)
  - Superficie arbitraria que encierra la carga (Q/ε₀)
  - Deducción por superposición para un conjunto de cargas
  - Ley de Gauss (Φ = Q_int/ε₀) y su carácter fundamental
  - Equivalencia Coulomb ↔ Gauss en electrostática
  - Superficies gaussianas y consideraciones de simetría
  - Rol del 4π y convención de ε₀
  - Aplicación: línea infinita cargada (E = λ/2πε₀r)
  - Aplicación: plano infinito cargado (E = σ/2ε₀)
  - Aplicación: cascarón esférico uniformemente cargado
  - Discontinuidad del campo y espesor real del cascarón
  - Ley de Gauss y conductores en equilibrio (E = 0, Q_neta = 0 en el interior)

